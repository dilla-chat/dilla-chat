name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't waste CI minutes on PRs that haven't been pushed recently.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    permissions:
      contents: read
      # The action needs to read the PR diff for inline annotations.
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # gitleaks needs full history to scan every commit on a PR
          # branch. Shallow clone (default depth=1) misses anything but
          # the tip.
          fetch-depth: 0

      # Pinned to a tagged release SHA — gitleaks-action is third-party
      # and we don't want supply-chain drift to silently change scan
      # behaviour. Bump when reviewing security workflow updates.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # As of v2 gitleaks-action requires a paid license key for
          # organisation repos. The token lives as the `GITLEAKS_TOKEN`
          # repo secret; the action reads `GITLEAKS_LICENSE`, so map
          # one to the other here.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_TOKEN }}
          # Action discovers `.gitleaks.toml` automatically at repo
          # root; the env var is explicit insurance against an upstream
          # change to the discovery rules.
          GITLEAKS_CONFIG: .gitleaks.toml
