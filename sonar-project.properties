sonar.projectKey=dilla-chat_dilla-chat
sonar.organization=dilla-chat

sonar.sources=client/src,server-rs/src
sonar.tests=client/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
sonar.rust.lcov.reportPaths=server-rs/lcov.info
sonar.coverage.exclusions=**/*.test.{ts,tsx},client/src/test/**,**/sessionStore.ts,client/src/services/websocket.ts,server-rs/src/ws/handlers/*.rs,server-rs/src/ws/client.rs,client/src/services/voiceIsolation/inferenceWorker.ts,client/src/services/voiceIsolation/audioWorklet/ringBufferProcessor.js,client/src/services/voiceIsolation/pipeline.ts,client/src/shell/**,client/src/pages/Onboarding/**,client/src/services/crypto/worker.ts,client/src/services/trustedTypes.ts
sonar.cpd.exclusions=**/*.test.{ts,tsx},**/test/**,**/mock*,**/tests.rs,**/test_helpers.rs

sonar.exclusions=client/public/**,docs/**

# Rust configuration
sonar.rust.clippy.reportPaths=server-rs/clippy-report.json

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e4.ruleKey=shellcheck:S1192
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S7781
sonar.issue.ignore.multicriteria.e3.resourceKey=**/telemetry.ts
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4123
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.{ts,tsx}
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.{ts,tsx},**/test/**,**/mock*
# e5/e6: src/shell/* and src/pages/Onboarding/* are verbatim ports from the
# design handoff (Mesh redesign) and still in their "make it work, type it
# later" phase. They use the prototype-style div-onClick pattern that
# Sonar's S1082 flags (each clickable element needs a paired keyboard
# handler). A11y will be tightened in the strict-pass refactor.
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e5.resourceKey=client/src/shell/**
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e6.resourceKey=client/src/pages/Onboarding/**
# e7: Math.random()-as-UI-jitter is everywhere in the handoff port (jitter
# offsets, animation seeds, mock ids). Scope the S2245 exemption to the
# handoff trees — production crypto already uses crypto.getRandomValues.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e7.resourceKey=client/src/shell/**,client/src/pages/Onboarding/**,client/src/services/browserLogs.ts
