# Dilla — nginx reverse-proxy reference config.
#
# Mode A from .security-hardening/03-architecture-review.md §9. nginx terminates
# TLS, dilla-server runs with DILLA_INSECURE=true on 127.0.0.1:8080.
#
# Required nginx version: 1.24+ (HTTP/2 push removed; we don't use it). For
# HTTP/3, requires nginx 1.25+ compiled with --with-http_v3_module.
# Required deps: certbot or acme.sh for cert provisioning (NOT shown — this
# config assumes the certs already exist at the paths below).
#
# Replace ${DILLA_DOMAIN}, ${TLS_CERT}, ${TLS_KEY} at deploy time (envsubst or
# Ansible / Nix template — do NOT commit live cert paths).

# --- 1. Connection upgrade map (required for WebSockets) ----------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- 2. Rate-limit zones (defense-in-depth; app also rate-limits) -------------
limit_req_zone $binary_remote_addr zone=dilla_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dilla_api:10m  rate=100r/s;

# --- 3. HTTP → HTTPS canonical redirect ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DILLA_DOMAIN};

    # ACME http-01 challenge (certbot webroot mode).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 4. Main HTTPS vhost ------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # listen 443 quic reuseport;  # uncomment for HTTP/3 (requires v3 module)
    server_name ${DILLA_DOMAIN};

    ssl_certificate     ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Security headers (mirror the Caddy config) ---------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "accelerometer=(), camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    more_clear_headers Server;   # requires headers-more-nginx-module

    # --- Upload size cap (50 MiB; > server-side DILLA_MAX_UPLOAD_SIZE) -------
    client_max_body_size 50m;
    client_body_buffer_size 1m;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    # --- Auth surface gets a stricter rate limit -----------------------------
    location ~ ^/api/v1/(auth|devices)/ {
        limit_req zone=dilla_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include    /etc/nginx/conf.d/dilla-proxy-common.inc;
    }

    location /api/ {
        limit_req zone=dilla_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include    /etc/nginx/conf.d/dilla-proxy-common.inc;
    }

    # --- WebSocket endpoint (Upgrade headers MUST be set) --------------------
    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Catch-all (SPA) ------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        include    /etc/nginx/conf.d/dilla-proxy-common.inc;
    }
}

# /etc/nginx/conf.d/dilla-proxy-common.inc — drop the following lines into it:
#
#   proxy_http_version 1.1;
#   proxy_set_header   Host              $host;
#   proxy_set_header   X-Real-IP         $remote_addr;
#   proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header   X-Forwarded-Proto $scheme;
#   proxy_set_header   X-Forwarded-Host  $host;
#   proxy_buffering    off;
#
# tested-with: nginx 1.26.0 (Debian 12 backports), OpenSSL 3.0.13, Apr 2026.
