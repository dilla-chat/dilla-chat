# Dilla — PodSecurity reference (Pod Security Standards, restricted profile).
#
# Apply the namespace label and the included pod template shows the
# securityContext that satisfies the restricted profile. PSP is GA-deprecated;
# this uses the namespace-label admission controller built into kube-apiserver.
#
# Tested-with: Kubernetes 1.30 (PodSecurity admission v1).

---
apiVersion: v1
kind: Namespace
metadata:
  name: dilla
  labels:
    # Enforce, audit, AND warn — three signals so misconfigured Pods are caught
    # at apply time, in audit logs, AND in kubectl output.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit:   restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn:    restricted
    pod-security.kubernetes.io/warn-version: latest

---
# Reference Deployment showing the securityContext that passes "restricted".
# Copy this template into your Helm chart / kustomization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dilla-server
  namespace: dilla
  labels:
    app.kubernetes.io/name: dilla-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dilla-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dilla-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dilla-server
          image: dilla/server:dev   # pin to a digest in production
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: federation
              containerPort: 9443
              protocol: TCP
          env:
            - name: DILLA_INSECURE
              value: "true"
            - name: DILLA_PORT
              value: "8080"
            - name: DILLA_DATA_DIR
              value: /data
            - name: DILLA_DB_PASSPHRASE_FILE
              value: /run/secrets/dilla/db-passphrase
            - name: DILLA_TRUSTED_PROXIES
              # Cluster pod CIDR — replace with your real value.
              value: "10.244.0.0/16"
          # ----- Hardening ---------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /run/secrets/dilla
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dilla-data
        - name: secrets
          secret:
            secretName: dilla-secrets
            defaultMode: 0400
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
