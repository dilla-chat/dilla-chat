# Dilla — pf reference rule-set (FreeBSD / OpenBSD / macOS).
#
# Threat model: dilla-server runs on this host behind a local reverse proxy,
# federation rides a WireGuard mesh, admin SSH is on a non-default port.
#
# Edit the macros below before loading, then:
#   FreeBSD:  service pf restart
#   OpenBSD:  pfctl -f /etc/pf.conf
#   macOS:    sudo pfctl -f /etc/pf.conf -e
#
# Tested-with: OpenBSD 7.5, FreeBSD 14.0, macOS Sonoma (limited).

# --- Macros (edit before loading) -------------------------------------------
ext_if          = "egress"                # use the default route iface tag
admin_cidr      = "203.0.113.0/24"
admin_ssh_port  = "2222"
wg_if           = "wg0"
wg_mesh_cidr    = "10.42.0.0/24"

# --- Tables -----------------------------------------------------------------
table <bruteforcers> persist
table <admins>       persist { $admin_cidr }
table <mesh_peers>   persist { $wg_mesh_cidr }

# --- Options ----------------------------------------------------------------
set skip on lo
set block-policy drop
set loginterface $ext_if

# --- Default: block all, log -----------------------------------------------
block return in  log all
block       out  log all

# Anti-spoofing.
antispoof quick for $ext_if

# Drop anyone in the bruteforce table immediately.
block quick from <bruteforcers>

# --- Inbound ----------------------------------------------------------------
# Admin SSH — rate limited; offenders go in the bruteforce table.
pass in on $ext_if proto tcp from <admins> to ($ext_if) port $admin_ssh_port \
    flags S/SA keep state \
    (max-src-conn 5, max-src-conn-rate 6/60, \
     overload <bruteforcers> flush global)

# Public web.
pass in on $ext_if proto tcp to ($ext_if) port { 80, 443 } flags S/SA keep state
pass in on $ext_if proto udp to ($ext_if) port 443 keep state          # HTTP/3

# WireGuard.
pass in on $ext_if proto udp to ($ext_if) port 51820 keep state

# Federation — only from mesh peers, on the mesh interface.
pass in on $wg_if proto tcp from <mesh_peers> to ($wg_if) port 9443 \
    flags S/SA keep state

# ICMP / ICMPv6 (rate limited).
pass in inet  proto icmp   icmp-type { echoreq, unreach } keep state
pass in inet6 proto icmp6  icmp6-type { echoreq, unreach, neighbradv, neighbrsol } keep state

# --- Outbound ---------------------------------------------------------------
# DNS, HTTPS, NTP.
pass out on $ext_if proto { tcp, udp } to any port 53  keep state
pass out on $ext_if proto tcp          to any port 443 keep state
pass out on $ext_if proto udp          to any port 123 keep state

# Federation peers.
pass out on $wg_if proto tcp to <mesh_peers> port 9443 keep state
pass out on $ext_if proto udp to any port 51820 keep state    # WG handshake
