# Dilla — nftables reference rule-set.
#
# Threat model: same as ufw.sh — dilla-server is behind a reverse proxy on this
# host, federation is on WireGuard (wg0), admin SSH is on a non-default port.
#
# Variables (edit before loading):
#   define ADMIN_CIDR     — IP range allowed to reach SSH
#   define ADMIN_SSH_PORT — non-default SSH port
#   define WG_MESH_CIDR   — WireGuard mesh range
#
# Usage:
#   sudo nft -f nftables.conf
#   sudo systemctl enable nftables    # persist across reboots
#
# Tested-with: nftables 1.0.6 on Debian 12, Linux 6.1.

flush ruleset

define ADMIN_CIDR     = 203.0.113.0/24
define ADMIN_SSH_PORT = 2222
define WG_MESH_CIDR   = 10.42.0.0/24

table inet filter {
    # Rate-limit set for SSH (kernel-side, accurate, no userspace).
    set ssh_brute {
        type ipv4_addr
        flags timeout
        timeout 1h
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        iif lo accept

        # ICMP — needed for path-MTU discovery. Rate-limited.
        ip  protocol icmp   limit rate 4/second accept
        ip6 nexthdr icmpv6  limit rate 4/second accept

        # SSH — IP-restricted, rate-limited.
        ip saddr $ADMIN_CIDR tcp dport $ADMIN_SSH_PORT \
            ct state new limit rate 6/minute accept
        ip saddr $ADMIN_CIDR tcp dport $ADMIN_SSH_PORT \
            ct state new add @ssh_brute { ip saddr timeout 1h }
        ip saddr @ssh_brute tcp dport $ADMIN_SSH_PORT drop

        # Public web.
        tcp dport { 80, 443 } accept
        udp dport 443 accept       # HTTP/3 (QUIC)

        # WireGuard.
        udp dport 51820 accept

        # Federation — only from mesh peers.
        ip saddr $WG_MESH_CIDR tcp dport 9443 accept

        # Default-deny w/ logging cap.
        limit rate 4/minute log prefix "nft-drop-in: " level warn
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # Not a router. Drop all forwarding.
    }

    chain output {
        type filter hook output priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        oif lo accept

        # DNS.
        udp dport 53 accept
        tcp dport 53 accept

        # HTTPS egress (Cloudflare TURN, ACME, Giphy).
        tcp dport 443 accept

        # NTP.
        udp dport 123 accept

        # Federation peers.
        ip daddr $WG_MESH_CIDR tcp dport 9443 accept

        # WireGuard.
        udp dport 51820 accept

        limit rate 4/minute log prefix "nft-drop-out: " level warn
    }
}
