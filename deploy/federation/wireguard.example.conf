# Dilla — WireGuard federation mesh templates.
#
# Architecture (per .security-hardening/03-architecture-review.md §9.2):
#   - Federation transport runs over wss://, but operators are STRONGLY
#     advised to wrap it in a WireGuard overlay so peers dial each other's
#     private mesh IPs, not their public IPs. Closes VULN-002 ingress paths
#     even if the per-peer Ed25519 pinning (R-02 / R-38) is incomplete.
#   - One private /24 for the mesh (here 10.42.0.0/24). Each peer holds a
#     single static IP on wg0.
#   - dilla-server binds its federation listener (`DILLA_FED_BIND_ADDR`) to
#     the wg0 address only — NEVER to 0.0.0.0.
#
# Tested-with: wireguard-tools 1.0.20210914 on Debian 12.

# ----------------------------------------------------------------------------
# 1. Hub node — /etc/wireguard/wg0.conf
# ----------------------------------------------------------------------------
[Interface]
# Hub static IP inside the mesh.
Address    = 10.42.0.1/24
ListenPort = 51820
PrivateKey = <hub-private-key>   # wg genkey | tee privatekey | wg pubkey > publickey

# Lock down the routing table — wg0 is for federation traffic only. NO
# default-route hijacking.
PostUp   = ip route add 10.42.0.0/24 dev wg0 || true
PostDown = ip route del 10.42.0.0/24 dev wg0 || true

# Optional: enforce per-peer source-IP at the firewall layer too.
# PostUp   = nft add rule inet filter input iif wg0 ip saddr 10.42.0.0/24 tcp dport 9443 accept

[Peer]
# Peer A.
PublicKey  = <peer-a-public-key>
AllowedIPs = 10.42.0.2/32
# PresharedKey is post-quantum belt-and-braces. Generate with `wg genpsk`.
PresharedKey = <psk-shared-with-peer-a>
# Persistent keepalive only on the side behind NAT.
# PersistentKeepalive = 25

[Peer]
# Peer B.
PublicKey  = <peer-b-public-key>
AllowedIPs = 10.42.0.3/32
PresharedKey = <psk-shared-with-peer-b>

# ----------------------------------------------------------------------------
# 2. Peer node (replace 10.42.0.2 with this peer's static address)
# ----------------------------------------------------------------------------
# [Interface]
# Address    = 10.42.0.2/24
# ListenPort = 51820
# PrivateKey = <peer-a-private-key>
#
# [Peer]
# PublicKey  = <hub-public-key>
# Endpoint   = hub.example.com:51820
# AllowedIPs = 10.42.0.0/24
# PresharedKey = <psk-shared-with-hub>
# PersistentKeepalive = 25

# ----------------------------------------------------------------------------
# 3. dilla-server config to pair with this mesh
# ----------------------------------------------------------------------------
# In /etc/dilla/dilla.env on the hub:
#
#   DILLA_PEERS=wss://10.42.0.2:9443,wss://10.42.0.3:9443
#   DILLA_FED_BIND_ADDR=10.42.0.1
#   DILLA_FEDERATION_PORT=9443
#   DILLA_FED_ADVERTISE_ADDR=10.42.0.1
#   DILLA_FED_ADVERTISE_PORT=9443
#   DILLA_NODE_NAME=hub
#
# IMPORTANT: dilla-server today uses DILLA_FED_BIND_ADDR (interface IP) and
# DILLA_FEDERATION_PORT separately — NOT a single DILLA_FEDERATION_BIND
# "addr:port" string. See 09-infra-security.md §5 (Open Items) for the
# follow-up to consolidate these into one env var for clarity.

# ----------------------------------------------------------------------------
# 4. Key distribution
# ----------------------------------------------------------------------------
# Each peer generates its own keypair locally — private keys never leave the
# host. Public keys + the shared PSK travel out of band (Signal DM, age-
# encrypted file in your config repo, etc.). NEVER commit a privatekey or PSK
# to this repo or any other git repo.
#
# Audit cadence: rotate PSKs every 90 days. Rotating WireGuard private keys
# requires a brief peer-by-peer reconfigure; schedule with the operators.
